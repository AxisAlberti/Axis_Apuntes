<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 420" font-family="Helvetica, Arial, sans-serif">
  <rect width="980" height="420" fill="#ffffff"/>
  <text x="490" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#111">Header USB 3.x interno de 19 pines (2×10, pin 20 sin pin) – vista desde arriba</text>

  <!-- etiquetas fila superior: pines 20..11 de izquierda a derecha -->
  <g font-size="12" text-anchor="middle" fill="#111">
    <g transform="translate(70,0)"><text y="95" fill="#b00020" font-weight="bold">KEY</text><text y="110" fill="#b00020">(20)</text></g>
    <g transform="translate(145,0)"><text y="95" font-weight="bold" fill="#c0392b">VBUS</text><text y="110">(19)</text></g>
    <g transform="translate(220,0)"><text y="95" font-weight="bold" fill="#1b7f3b">SSRX2−</text><text y="110">(18)</text></g>
    <g transform="translate(295,0)"><text y="95" font-weight="bold" fill="#1b7f3b">SSRX2+</text><text y="110">(17)</text></g>
    <g transform="translate(370,0)"><text y="95" font-weight="bold" fill="#333">GND</text><text y="110">(16)</text></g>
    <g transform="translate(445,0)"><text y="95" font-weight="bold" fill="#1f5fbf">SSTX2−</text><text y="110">(15)</text></g>
    <g transform="translate(520,0)"><text y="95" font-weight="bold" fill="#1f5fbf">SSTX2+</text><text y="110">(14)</text></g>
    <g transform="translate(595,0)"><text y="95" font-weight="bold" fill="#333">GND</text><text y="110">(13)</text></g>
    <g transform="translate(670,0)"><text y="95" font-weight="bold" fill="#d97706">D2−</text><text y="110">(12)</text></g>
    <g transform="translate(745,0)"><text y="95" font-weight="bold" fill="#d97706">D2+</text><text y="110">(11)</text></g>
  </g>

  <!-- cuerpo del conector -->
  <rect x="35" y="125" width="745" height="120" rx="8" fill="#eef2f7" stroke="#334155" stroke-width="3"/>
  <g font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">
    <!-- fila superior 20..11 -->
    <circle cx="70" cy="160" r="19" fill="#ffffff" stroke="#b00020" stroke-width="2" stroke-dasharray="4 3"/><text x="70" y="165" fill="#b00020">20</text>
    <circle cx="145" cy="160" r="19" fill="#c0392b"/><text x="145" y="165">19</text>
    <circle cx="220" cy="160" r="19" fill="#1b7f3b"/><text x="220" y="165">18</text>
    <circle cx="295" cy="160" r="19" fill="#1b7f3b"/><text x="295" y="165">17</text>
    <circle cx="370" cy="160" r="19" fill="#333"/><text x="370" y="165">16</text>
    <circle cx="445" cy="160" r="19" fill="#1f5fbf"/><text x="445" y="165">15</text>
    <circle cx="520" cy="160" r="19" fill="#1f5fbf"/><text x="520" y="165">14</text>
    <circle cx="595" cy="160" r="19" fill="#333"/><text x="595" y="165">13</text>
    <circle cx="670" cy="160" r="19" fill="#d97706"/><text x="670" y="165">12</text>
    <circle cx="745" cy="160" r="19" fill="#d97706"/><text x="745" y="165">11</text>
    <!-- fila inferior 1..10 -->
    <rect x="53" y="193" width="34" height="34" fill="#c0392b"/><text x="70" y="216">1</text>
    <circle cx="145" cy="210" r="19" fill="#1b7f3b"/><text x="145" y="215">2</text>
    <circle cx="220" cy="210" r="19" fill="#1b7f3b"/><text x="220" y="215">3</text>
    <circle cx="295" cy="210" r="19" fill="#333"/><text x="295" y="215">4</text>
    <circle cx="370" cy="210" r="19" fill="#1f5fbf"/><text x="370" y="215">5</text>
    <circle cx="445" cy="210" r="19" fill="#1f5fbf"/><text x="445" y="215">6</text>
    <circle cx="520" cy="210" r="19" fill="#333"/><text x="520" y="215">7</text>
    <circle cx="595" cy="210" r="19" fill="#d97706"/><text x="595" y="215">8</text>
    <circle cx="670" cy="210" r="19" fill="#d97706"/><text x="670" y="215">9</text>
    <circle cx="745" cy="210" r="19" fill="#6b7280"/><text x="745" y="215">10</text>
  </g>

  <!-- etiquetas fila inferior: pines 1..10 -->
  <g font-size="12" text-anchor="middle" fill="#111">
    <g transform="translate(70,0)"><text y="268">(1)</text><text y="284" font-weight="bold" fill="#c0392b">VBUS</text></g>
    <g transform="translate(145,0)"><text y="268">(2)</text><text y="284" font-weight="bold" fill="#1b7f3b">SSRX1−</text></g>
    <g transform="translate(220,0)"><text y="268">(3)</text><text y="284" font-weight="bold" fill="#1b7f3b">SSRX1+</text></g>
    <g transform="translate(295,0)"><text y="268">(4)</text><text y="284" font-weight="bold" fill="#333">GND</text></g>
    <g transform="translate(370,0)"><text y="268">(5)</text><text y="284" font-weight="bold" fill="#1f5fbf">SSTX1−</text></g>
    <g transform="translate(445,0)"><text y="268">(6)</text><text y="284" font-weight="bold" fill="#1f5fbf">SSTX1+</text></g>
    <g transform="translate(520,0)"><text y="268">(7)</text><text y="284" font-weight="bold" fill="#333">GND</text></g>
    <g transform="translate(595,0)"><text y="268">(8)</text><text y="284" font-weight="bold" fill="#d97706">D1−</text></g>
    <g transform="translate(670,0)"><text y="268">(9)</text><text y="284" font-weight="bold" fill="#d97706">D1+</text></g>
    <g transform="translate(745,0)"><text y="268">(10)</text><text y="284" font-weight="bold" fill="#6b7280">ID / OC#*</text></g>
  </g>

  <!-- leyenda -->
  <g font-size="12" fill="#111">
    <rect x="35" y="315" width="14" height="14" fill="#c0392b"/><text x="56" y="327">VBUS (+5 V)</text>
    <rect x="165" y="315" width="14" height="14" fill="#333"/><text x="186" y="327">GND</text>
    <rect x="235" y="315" width="14" height="14" fill="#1f5fbf"/><text x="256" y="327">SSTX (transmisión SuperSpeed)</text>
    <rect x="465" y="315" width="14" height="14" fill="#1b7f3b"/><text x="486" y="327">SSRX (recepción SuperSpeed)</text>
    <rect x="685" y="315" width="14" height="14" fill="#d97706"/><text x="706" y="327">D+/D− (USB 2.0)</text>
  </g>
  <text x="35" y="355" font-size="12" fill="#111">Puerto 1: pines 1–9 · Puerto 2: pines 11–19 · Pin 1 con pad cuadrado · Pin 20 sin pin (clave).</text>
  <text x="35" y="373" font-size="12" fill="#111">* El pin 10 figura como «ID» en la documentación de Intel y algunas placas lo usan como USBOC− (sobrecorriente).</text>
  <text x="490" y="402" text-anchor="middle" font-size="11" fill="#666">Esquema propio basado en la documentación de Intel (USB 3.0 Internal Connector). Comprueba el manual de tu placa.</text>
</svg>
