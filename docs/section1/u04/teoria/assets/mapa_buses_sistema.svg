<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" font-family="Helvetica, Arial, sans-serif">
  <rect width="1000" height="700" fill="#ffffff"/>
  <text x="500" y="30" text-anchor="middle" font-size="21" font-weight="bold" fill="#111">Mapa de buses de un PC de sobremesa actual</text>

  <!-- RAM -->
  <rect x="40" y="70" width="190" height="70" rx="10" fill="#1b7f3b"/>
  <text x="135" y="100" text-anchor="middle" font-size="16" font-weight="bold" fill="#fff">Memoria RAM</text>
  <text x="135" y="122" text-anchor="middle" font-size="13" fill="#fff">DDR5 · 2 canales</text>
  <line x1="230" y1="105" x2="380" y2="105" stroke="#1b7f3b" stroke-width="8"/>
  <text x="305" y="92" text-anchor="middle" font-size="12" fill="#1b7f3b" font-weight="bold">Bus de memoria</text>
  <text x="305" y="124" text-anchor="middle" font-size="11" fill="#333">64 bits por canal</text>
  <text x="305" y="139" text-anchor="middle" font-size="11" fill="#333">≈48 GB/s (DDR5-6000)</text>

  <!-- CPU -->
  <rect x="380" y="60" width="240" height="110" rx="12" fill="#1f3b73"/>
  <text x="500" y="100" text-anchor="middle" font-size="20" font-weight="bold" fill="#fff">CPU</text>
  <text x="500" y="124" text-anchor="middle" font-size="12" fill="#dbe7ff">controlador de memoria + líneas PCIe</text>
  <text x="500" y="144" text-anchor="middle" font-size="12" fill="#dbe7ff">(Infinity Fabric / anillo: interno de la CPU)</text>

  <!-- GPU -->
  <rect x="780" y="60" width="190" height="55" rx="10" fill="#7c3aed"/>
  <text x="875" y="93" text-anchor="middle" font-size="16" font-weight="bold" fill="#fff">GPU</text>
  <line x1="620" y1="88" x2="780" y2="88" stroke="#7c3aed" stroke-width="8"/>
  <text x="700" y="75" text-anchor="middle" font-size="12" fill="#7c3aed" font-weight="bold">PCIe 5.0 x16</text>

  <!-- SSD de CPU -->
  <rect x="780" y="130" width="190" height="55" rx="10" fill="#7c3aed"/>
  <text x="875" y="154" text-anchor="middle" font-size="15" font-weight="bold" fill="#fff">SSD NVMe (M.2)</text>
  <text x="875" y="173" text-anchor="middle" font-size="12" fill="#fff">conectado a la CPU</text>
  <line x1="620" y1="158" x2="780" y2="158" stroke="#7c3aed" stroke-width="8"/>
  <text x="700" y="148" text-anchor="middle" font-size="12" fill="#7c3aed" font-weight="bold">PCIe 5.0 x4</text>

  <!-- enlace al chipset -->
  <line x1="500" y1="170" x2="500" y2="260" stroke="#c0392b" stroke-width="10"/>
  <text x="515" y="205" font-size="13" fill="#c0392b" font-weight="bold">Enlace CPU ↔ chipset</text>
  <text x="515" y="223" font-size="12" fill="#333">Intel: DMI 4.0 x8 (≈15,8 GB/s)</text>
  <text x="515" y="240" font-size="12" fill="#333">AMD: PCIe 4.0 x4 (≈7,9 GB/s)</text>

  <!-- Chipset -->
  <rect x="330" y="260" width="340" height="90" rx="12" fill="#b45309"/>
  <text x="500" y="298" text-anchor="middle" font-size="20" font-weight="bold" fill="#fff">Chipset (PCH)</text>
  <text x="500" y="322" text-anchor="middle" font-size="12" fill="#ffe9cf">todo lo que cuelga comparte el enlace con la CPU</text>

  <!-- Buses del chipset: 6 cajas -->
  <g stroke-width="5">
    <line x1="400" y1="350" x2="120" y2="440" stroke="#7c3aed"/>
    <line x1="440" y1="350" x2="290" y2="440" stroke="#0f766e"/>
    <line x1="480" y1="350" x2="460" y2="440" stroke="#2563eb"/>
    <line x1="520" y1="350" x2="630" y2="440" stroke="#be185d"/>
    <line x1="560" y1="350" x2="790" y2="440" stroke="#6b7280"/>
    <line x1="600" y1="350" x2="900" y2="440" stroke="#6b7280"/>
  </g>

  <g font-size="12" text-anchor="middle">
    <rect x="30" y="440" width="180" height="120" rx="10" fill="#f3e8ff" stroke="#7c3aed" stroke-width="2"/>
    <text x="120" y="468" font-weight="bold" fill="#5b21b6" font-size="14">PCIe 4.0 (chipset)</text>
    <text x="120" y="490" fill="#333">x1 / x2 / x4</text>
    <text x="120" y="508" fill="#333">M.2 adicionales, tarjetas</text>
    <text x="120" y="526" fill="#333">de expansión, Ethernet,</text>
    <text x="120" y="544" fill="#333">Wi‑Fi (PCIe o CNVi)</text>

    <rect x="215" y="440" width="150" height="120" rx="10" fill="#ccfbf1" stroke="#0f766e" stroke-width="2"/>
    <text x="290" y="468" font-weight="bold" fill="#0f766e" font-size="14">SATA</text>
    <text x="290" y="490" fill="#333">6 Gb/s (600 MB/s)</text>
    <text x="290" y="508" fill="#333">HDD y SSD de 2,5"</text>
    <text x="290" y="526" fill="#333">punto a punto</text>

    <rect x="385" y="440" width="150" height="120" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="460" y="468" font-weight="bold" fill="#1d4ed8" font-size="14">USB</text>
    <text x="460" y="490" fill="#333">2.0 · 3.x · USB4</text>
    <text x="460" y="508" fill="#333">teclado, ratón, discos,</text>
    <text x="460" y="526" fill="#333">cámaras… (árbol</text>
    <text x="460" y="544" fill="#333">con hubs)</text>

    <rect x="555" y="440" width="150" height="120" rx="10" fill="#fce7f3" stroke="#be185d" stroke-width="2"/>
    <text x="630" y="468" font-weight="bold" fill="#9d174d" font-size="14">Audio HD (HDA)</text>
    <text x="630" y="490" fill="#333">códec de audio</text>
    <text x="630" y="508" fill="#333">jacks y front panel</text>

    <rect x="720" y="440" width="120" height="120" rx="10" fill="#f3f4f6" stroke="#6b7280" stroke-width="2"/>
    <text x="780" y="468" font-weight="bold" fill="#374151" font-size="14">SPI / eSPI</text>
    <text x="780" y="490" fill="#333">BIOS/UEFI,</text>
    <text x="780" y="508" fill="#333">controlador</text>
    <text x="780" y="526" fill="#333">embebido, TPM</text>

    <rect x="850" y="440" width="120" height="120" rx="10" fill="#f3f4f6" stroke="#6b7280" stroke-width="2"/>
    <text x="910" y="468" font-weight="bold" fill="#374151" font-size="14">I²C / SMBus</text>
    <text x="910" y="490" fill="#333">sensores,</text>
    <text x="910" y="508" fill="#333">SPD de la RAM,</text>
    <text x="910" y="526" fill="#333">control de energía</text>
  </g>

  <text x="500" y="600" text-anchor="middle" font-size="12" fill="#333">Los dispositivos conectados a la CPU (GPU, SSD M.2 de CPU, RAM) no pasan por el chipset: tienen su propio enlace directo.</text>
  <text x="500" y="620" text-anchor="middle" font-size="12" fill="#333">Las cifras son de la plataforma Intel serie 800 / AMD AM5 (2025–2026); varían según el modelo de placa.</text>
  <text x="500" y="680" text-anchor="middle" font-size="11" fill="#666">Esquema propio basado en la documentación pública de Intel y AMD.</text>
</svg>
