<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker>
  </defs>
  <rect width="1000" height="470" fill="#ffffff"/>
  <text x="500" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#111">Los tres buses clásicos de un sistema</text>

  <g font-size="17" font-weight="bold" fill="#fff" text-anchor="middle">
    <rect x="200" y="60" width="200" height="80" rx="10" fill="#1f3b73"/><text x="300" y="108">CPU</text>
    <rect x="450" y="60" width="200" height="80" rx="10" fill="#1b7f3b"/><text x="550" y="108">Memoria RAM</text>
    <rect x="700" y="60" width="200" height="80" rx="10" fill="#b45309"/><text x="800" y="108">Dispositivos de E/S</text>
  </g>

  <g stroke-width="10" stroke-linecap="round">
    <line x1="190" y1="215" x2="930" y2="215" stroke="#c0392b"/>
    <line x1="190" y1="285" x2="930" y2="285" stroke="#1f5fbf"/>
    <line x1="190" y1="355" x2="930" y2="355" stroke="#6b7280"/>
  </g>
  <g font-size="14" font-weight="bold">
    <text x="20" y="220" fill="#c0392b">Bus de direcciones</text>
    <text x="20" y="290" fill="#1f5fbf">Bus de datos</text>
    <text x="20" y="360" fill="#444">Bus de control</text>
  </g>

  <g stroke="#333" stroke-width="2" marker-end="url(#a)">
    <line x1="250" y1="140" x2="250" y2="205"/><line x1="300" y1="140" x2="300" y2="275"/><line x1="350" y1="140" x2="350" y2="345"/>
    <line x1="500" y1="140" x2="500" y2="205"/><line x1="550" y1="140" x2="550" y2="275"/><line x1="600" y1="140" x2="600" y2="345"/>
    <line x1="750" y1="140" x2="750" y2="205"/><line x1="800" y1="140" x2="800" y2="275"/><line x1="850" y1="140" x2="850" y2="345"/>
  </g>

  <g font-size="13" fill="#111">
    <text x="20" y="400"><tspan font-weight="bold" fill="#c0392b">Direcciones:</tspan> indica DÓNDE se lee o escribe · unidireccional (CPU → memoria / E/S).</text>
    <text x="20" y="420"><tspan font-weight="bold" fill="#1f5fbf">Datos:</tspan> transporta el DATO · bidireccional · su ancho (32/64 bits) limita lo que se mueve por ciclo.</text>
    <text x="20" y="440"><tspan font-weight="bold" fill="#444">Control:</tspan> lectura/escritura, reloj, interrupciones, reset y arbitraje del bus.</text>
  </g>
  <text x="500" y="462" text-anchor="middle" font-size="11" fill="#666">Esquema propio. En los PC actuales estas funciones viajan por enlaces serie punto a punto (PCIe, DMI, USB, SATA…), pero el concepto sigue vigente.</text>
</svg>
