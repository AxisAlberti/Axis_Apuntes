<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" font-family="Helvetica, Arial, sans-serif">
  <rect width="760" height="330" fill="#ffffff"/>
  <text x="380" y="28" text-anchor="middle" font-size="19" font-weight="bold" fill="#111">Header de audio frontal HD Audio (AAFP) – 10 pines, vista desde arriba</text>

  <!-- Fila superior: pines pares -->
  <g font-size="12" fill="#111" text-anchor="middle">
    <g transform="translate(110,0)"><text x="0" y="62" font-weight="bold">GND</text><text x="0" y="78" fill="#444">Masa</text><line x1="0" y1="86" x2="0" y2="120" stroke="#666"/></g>
    <g transform="translate(220,0)"><text x="0" y="62" font-weight="bold">PRESENCE#</text><text x="0" y="78" fill="#444">Presencia</text><line x1="0" y1="86" x2="0" y2="120" stroke="#666"/></g>
    <g transform="translate(330,0)"><text x="0" y="62" font-weight="bold">SENSE1_RETURN</text><text x="0" y="78" fill="#444">Retorno micro</text><line x1="0" y1="86" x2="0" y2="120" stroke="#666"/></g>
    <g transform="translate(440,0)"><text x="0" y="62" font-weight="bold" fill="#b00020">KEY</text><text x="0" y="78" fill="#b00020">Clave</text><line x1="0" y1="86" x2="0" y2="120" stroke="#b00020" stroke-dasharray="3 3"/></g>
    <g transform="translate(550,0)"><text x="0" y="62" font-weight="bold">SENSE2_RETURN</text><text x="0" y="78" fill="#444">Retorno cascos</text><line x1="0" y1="86" x2="0" y2="120" stroke="#666"/></g>
  </g>

  <!-- Cuerpo del conector -->
  <rect x="60" y="120" width="540" height="100" rx="8" fill="#e6eefc" stroke="#1f3b73" stroke-width="3"/>
  <g font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">
    <!-- fila superior (2,4,6,8,10) -->
    <circle cx="110" cy="150" r="17" fill="#1f3b73"/><text x="110" y="155">2</text>
    <circle cx="220" cy="150" r="17" fill="#1f3b73"/><text x="220" y="155">4</text>
    <circle cx="330" cy="150" r="17" fill="#1f3b73"/><text x="330" y="155">6</text>
    <circle cx="440" cy="150" r="17" fill="#ffffff" stroke="#b00020" stroke-width="2" stroke-dasharray="4 3"/><text x="440" y="155" fill="#b00020">8</text>
    <circle cx="550" cy="150" r="17" fill="#1f3b73"/><text x="550" y="155">10</text>
    <!-- fila inferior (1,3,5,7,9) -->
    <rect x="93" y="173" width="34" height="34" fill="#c0392b"/><text x="110" y="196">1</text>
    <circle cx="220" cy="190" r="17" fill="#1f3b73"/><text x="220" y="195">3</text>
    <circle cx="330" cy="190" r="17" fill="#1f3b73"/><text x="330" y="195">5</text>
    <circle cx="440" cy="190" r="17" fill="#1f3b73"/><text x="440" y="195">7</text>
    <circle cx="550" cy="190" r="17" fill="#1f3b73"/><text x="550" y="195">9</text>
  </g>

  <!-- Fila inferior: pines impares -->
  <g font-size="12" fill="#111" text-anchor="middle">
    <g transform="translate(110,0)"><line x1="0" y1="220" x2="0" y2="254" stroke="#666"/><text x="0" y="272" font-weight="bold">PORT1_L</text><text x="0" y="288" fill="#444">Micro (L / mono)</text></g>
    <g transform="translate(220,0)"><line x1="0" y1="220" x2="0" y2="254" stroke="#666"/><text x="0" y="272" font-weight="bold">PORT1_R</text><text x="0" y="288" fill="#444">Micro (R / bias)</text></g>
    <g transform="translate(330,0)"><line x1="0" y1="220" x2="0" y2="254" stroke="#666"/><text x="0" y="272" font-weight="bold">PORT2_R</text><text x="0" y="288" fill="#444">Auriculares R</text></g>
    <g transform="translate(440,0)"><line x1="0" y1="220" x2="0" y2="254" stroke="#666"/><text x="0" y="272" font-weight="bold">SENSE_SEND</text><text x="0" y="288" fill="#444">Línea de sensado</text></g>
    <g transform="translate(550,0)"><line x1="0" y1="220" x2="0" y2="254" stroke="#666"/><text x="0" y="272" font-weight="bold">PORT2_L</text><text x="0" y="288" fill="#444">Auriculares L</text></g>
  </g>

  <text x="660" y="160" font-size="12" fill="#444">Pin 1: pad</text>
  <text x="660" y="176" font-size="12" fill="#444">cuadrado</text>
  <text x="380" y="316" text-anchor="middle" font-size="11" fill="#666">Esquema propio basado en la documentación de Intel (Front Panel Audio Header). Comprueba el manual de tu placa.</text>
</svg>
