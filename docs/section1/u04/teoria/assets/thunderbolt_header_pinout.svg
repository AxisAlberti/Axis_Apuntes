<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" font-family="Helvetica, Arial, sans-serif">
  <rect width="960" height="600" fill="#ffffff"/>
  <text x="480" y="32" text-anchor="middle" font-size="21" font-weight="bold" fill="#111">Header Thunderbolt de 14‑1 pines (TB_HEADER), vista desde arriba</text>
  <text x="480" y="56" text-anchor="middle" font-size="13" fill="#444">Cable de señales de control hacia la tarjeta Thunderbolt 4 (por ejemplo, ASUS ThunderboltEX 4)</text>

  <!-- etiquetas fila superior (pines pares) -->
  <g font-size="12" font-weight="bold" text-anchor="middle">
    <text x="140" y="140" fill="#1f5fbf">I2C_SCL</text>
    <text x="260" y="140" fill="#1f5fbf">I2C_SDA</text>
    <text x="380" y="140" fill="#1f5fbf">I2C_IRQ#</text>
    <text x="500" y="140" fill="#b45309">RTD3_POWER_EN</text>
    <text x="620" y="140" fill="#b45309">S_SLP_S0#_IDLE</text>
    <text x="740" y="140" fill="#7c3aed">PERST_N</text>
    <text x="860" y="140" fill="#7c3aed">WAKE#</text>
  </g>
  <g stroke="#9ca3af" stroke-width="1.5">
    <line x1="140" y1="150" x2="140" y2="198"/><line x1="260" y1="150" x2="260" y2="198"/><line x1="380" y1="150" x2="380" y2="198"/>
    <line x1="500" y1="150" x2="500" y2="198"/><line x1="620" y1="150" x2="620" y2="198"/><line x1="740" y1="150" x2="740" y2="198"/><line x1="860" y1="150" x2="860" y2="198"/>
  </g>

  <!-- cuerpo del conector -->
  <rect x="70" y="180" width="860" height="170" rx="10" fill="#eef2f7" stroke="#334155" stroke-width="3"/>
  <g font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">
    <!-- fila superior: 2,4,6,8,10,12,14 -->
    <circle cx="140" cy="220" r="21" fill="#1f5fbf"/><text x="140" y="225">2</text>
    <circle cx="260" cy="220" r="21" fill="#1f5fbf"/><text x="260" y="225">4</text>
    <circle cx="380" cy="220" r="21" fill="#1f5fbf"/><text x="380" y="225">6</text>
    <circle cx="500" cy="220" r="21" fill="#d97706"/><text x="500" y="225">8</text>
    <circle cx="620" cy="220" r="21" fill="#d97706"/><text x="620" y="225">10</text>
    <circle cx="740" cy="220" r="21" fill="#7c3aed"/><text x="740" y="225">12</text>
    <circle cx="860" cy="220" r="21" fill="#7c3aed"/><text x="860" y="225">14</text>
    <!-- fila inferior: 1,3,5,7,9,(11 clave),13 -->
    <rect x="118" y="288" width="44" height="44" fill="#d97706"/><text x="140" y="316">1</text>
    <circle cx="260" cy="310" r="21" fill="#1f5fbf"/><text x="260" y="315">3</text>
    <circle cx="380" cy="310" r="21" fill="#d97706"/><text x="380" y="315">5</text>
    <circle cx="500" cy="310" r="21" fill="#d97706"/><text x="500" y="315">7</text>
    <circle cx="620" cy="310" r="21" fill="#333"/><text x="620" y="315">9</text>
    <circle cx="740" cy="310" r="21" fill="#ffffff" stroke="#b00020" stroke-width="2.5" stroke-dasharray="5 4"/><text x="740" y="315" fill="#b00020">11</text>
    <circle cx="860" cy="310" r="21" fill="#d97706"/><text x="860" y="315">13</text>
  </g>

  <!-- etiquetas fila inferior (pines impares) -->
  <g stroke="#9ca3af" stroke-width="1.5">
    <line x1="140" y1="350" x2="140" y2="382"/><line x1="260" y1="350" x2="260" y2="382"/><line x1="380" y1="350" x2="380" y2="382"/>
    <line x1="500" y1="350" x2="500" y2="382"/><line x1="620" y1="350" x2="620" y2="382"/><line x1="860" y1="350" x2="860" y2="382"/>
    <line x1="740" y1="350" x2="740" y2="382" stroke="#b00020" stroke-dasharray="4 3"/>
  </g>
  <g font-size="13" font-weight="bold" text-anchor="middle">
    <text x="140" y="402" fill="#b45309">FORCE_PWR</text>
    <text x="260" y="402" fill="#1f5fbf">TB_CIO_PLUG_EVENT</text>
    <text x="380" y="402" fill="#b45309">SLP_S3#</text>
    <text x="500" y="402" fill="#b45309">SLP_S5#</text>
    <text x="620" y="402" fill="#333">GND</text>
    <text x="740" y="402" fill="#b00020">CLAVE</text>
    <text x="740" y="420" font-size="11" font-weight="normal" fill="#b00020">(sin pin)</text>
    <text x="860" y="402" fill="#b45309">RTD3_SW</text>
  </g>

  <!-- leyenda -->
  <g font-size="13" fill="#111">
    <rect x="70" y="456" width="16" height="16" fill="#d97706"/><text x="94" y="469">Alimentación y estados de reposo</text>
    <rect x="320" y="456" width="16" height="16" fill="#1f5fbf"/><text x="344" y="469">Gestión (I²C y evento de conexión)</text>
    <rect x="500" y="456" width="16" height="16" fill="#7c3aed"/><text x="524" y="469">PCI Express (reset y despertar)</text>
    <rect x="760" y="456" width="16" height="16" fill="#333"/><text x="784" y="469">Masa (GND)</text>
  </g>
  <g font-size="12.5" fill="#333">
    <text x="70" y="506">Numeración: fila inferior = pines impares (1, 3, 5, 7, 9, 13; el pin 1 es el cuadrado) · fila superior = pines pares (2, 4, 6, 8, 10, 12, 14).</text>
    <text x="70" y="526">El pin 11 no existe (clave): 14 posiciones − 1 = 13 pines. Distribución del header de ASUS para Intel; otros fabricantes usan otras (ASRock: 5 y 10 pines).</text>
    <text x="70" y="546">Pin 3: TB_CIO_PLUG_EVENT en las placas Intel; en las ASUS para AMD (p. ej. B550-F) es GND.</text>
  </g>
  <text x="480" y="574" text-anchor="middle" font-size="11" fill="#666">Esquema propio basado en el manual de ASUS (manuales ASUS PRIME Z590-P y ROG STRIX B550‑F GAMING WIFI II, header TB_HEADER).</text>
</svg>
