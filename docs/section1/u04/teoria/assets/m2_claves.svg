<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" font-family="Helvetica, Arial, sans-serif">
  <rect width="960" height="470" fill="#ffffff"/>
  <text x="480" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#111">M.2: claves (muescas) del conector y qué interfaces llevan</text>
  <text x="480" y="52" text-anchor="middle" font-size="12" fill="#444">Borde de contactos del módulo, pines 1 a 75. La muesca impide insertar un módulo en un zócalo de otra clave.</text>

  <!-- escala pines: x = 40 + (pin-1)*9 ; ancho total 666 -->
  <g font-size="11" fill="#666" text-anchor="middle">
    <text x="40" y="82">pin 1</text><text x="706" y="82">pin 75</text>
  </g>

  <!-- fila: Clave M -->
  <g>
    <rect x="40" y="95" width="666" height="34" fill="#f1c40f" stroke="#7a6400"/>
    <rect x="544" y="95" width="63" height="22" fill="#ffffff" stroke="#b00020" stroke-width="2"/>
    <text x="725" y="117" font-size="15" font-weight="bold" fill="#111">Clave M</text>
    <text x="725" y="134" font-size="12" fill="#333">SSD NVMe (PCIe x4) y SATA</text>
    <text x="575" y="112" text-anchor="middle" font-size="10" fill="#b00020">pines 59–66</text>
  </g>

  <!-- fila: Clave B -->
  <g>
    <rect x="40" y="170" width="666" height="34" fill="#f1c40f" stroke="#7a6400"/>
    <rect x="139" y="170" width="63" height="22" fill="#ffffff" stroke="#b00020" stroke-width="2"/>
    <text x="725" y="192" font-size="15" font-weight="bold" fill="#111">Clave B</text>
    <text x="725" y="209" font-size="12" fill="#333">SATA, PCIe x2, USB, audio</text>
    <text x="170" y="187" text-anchor="middle" font-size="10" fill="#b00020">pines 12–19</text>
  </g>

  <!-- fila: Clave B+M -->
  <g>
    <rect x="40" y="245" width="666" height="34" fill="#f1c40f" stroke="#7a6400"/>
    <rect x="139" y="245" width="63" height="22" fill="#ffffff" stroke="#b00020" stroke-width="2"/>
    <rect x="544" y="245" width="63" height="22" fill="#ffffff" stroke="#b00020" stroke-width="2"/>
    <text x="725" y="267" font-size="15" font-weight="bold" fill="#111">Clave B+M</text>
    <text x="725" y="284" font-size="12" fill="#333">SATA o PCIe x2 (SSD)</text>
    <text x="170" y="262" text-anchor="middle" font-size="10" fill="#b00020">12–19</text>
    <text x="575" y="262" text-anchor="middle" font-size="10" fill="#b00020">59–66</text>
  </g>

  <!-- fila: Clave E -->
  <g>
    <rect x="40" y="320" width="666" height="34" fill="#f1c40f" stroke="#7a6400"/>
    <rect x="256" y="320" width="63" height="22" fill="#ffffff" stroke="#b00020" stroke-width="2"/>
    <text x="725" y="342" font-size="15" font-weight="bold" fill="#111">Clave E</text>
    <text x="725" y="359" font-size="12" fill="#333">Wi‑Fi / Bluetooth (PCIe x1, USB 2.0, CNVi)</text>
    <text x="287" y="337" text-anchor="middle" font-size="10" fill="#b00020">pines 24–31</text>
  </g>

  <!-- fila: Clave A+E -->
  <g>
    <rect x="40" y="395" width="666" height="34" fill="#f1c40f" stroke="#7a6400"/>
    <rect x="112" y="395" width="63" height="22" fill="#ffffff" stroke="#b00020" stroke-width="2"/>
    <rect x="256" y="395" width="63" height="22" fill="#ffffff" stroke="#b00020" stroke-width="2"/>
    <text x="725" y="417" font-size="15" font-weight="bold" fill="#111">Clave A+E</text>
    <text x="725" y="434" font-size="12" fill="#333">Wi‑Fi y módulos inalámbricos</text>
    <text x="143" y="412" text-anchor="middle" font-size="10" fill="#b00020">8–15</text>
    <text x="287" y="412" text-anchor="middle" font-size="10" fill="#b00020">24–31</text>
  </g>

  <text x="480" y="458" text-anchor="middle" font-size="11" fill="#666">Esquema propio basado en la especificación M.2 (PCI-SIG). Tamaños: 2230, 2242, 2260, 2280 y 22110 (ancho × largo en mm).</text>
</svg>
