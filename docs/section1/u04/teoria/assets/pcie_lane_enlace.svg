<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="b" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" refX="14" refY="8" orient="auto"><path d="M0,0 L16,8 L0,16 z" fill="#1f5fbf"/></marker>
    <marker id="r" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" refX="14" refY="8" orient="auto"><path d="M0,0 L16,8 L0,16 z" fill="#c0392b"/></marker>
  </defs>
  <rect width="900" height="470" fill="#ffffff"/>
  <text x="450" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#111">Enlace PCIe x4: cuatro lanes entre dos dispositivos</text>

  <rect x="100" y="55" width="520" height="60" rx="10" fill="#1f3b73"/>
  <text x="360" y="92" text-anchor="middle" font-size="17" font-weight="bold" fill="#fff">Dispositivo PCIe A (p. ej., la CPU)</text>
  <rect x="100" y="345" width="520" height="60" rx="10" fill="#1b7f3b"/>
  <text x="360" y="382" text-anchor="middle" font-size="17" font-weight="bold" fill="#fff">Dispositivo PCIe B (p. ej., un SSD NVMe)</text>

  <rect x="130" y="115" width="460" height="230" fill="#eef6e8" stroke="#8fbf6a" stroke-width="2"/>

  <g stroke-width="4" fill="none">
    <line x1="175" y1="135" x2="175" y2="290" stroke="#1f5fbf" marker-end="url(#b)"/><line x1="205" y1="290" x2="205" y2="135" stroke="#c0392b" marker-end="url(#r)"/>
    <line x1="295" y1="135" x2="295" y2="290" stroke="#1f5fbf" marker-end="url(#b)"/><line x1="325" y1="290" x2="325" y2="135" stroke="#c0392b" marker-end="url(#r)"/>
    <line x1="415" y1="135" x2="415" y2="290" stroke="#1f5fbf" marker-end="url(#b)"/><line x1="445" y1="290" x2="445" y2="135" stroke="#c0392b" marker-end="url(#r)"/>
    <line x1="535" y1="135" x2="535" y2="290" stroke="#1f5fbf" marker-end="url(#b)"/><line x1="565" y1="290" x2="565" y2="135" stroke="#c0392b" marker-end="url(#r)"/>
  </g>
  <g font-size="14" font-weight="bold" fill="#333" text-anchor="middle">
    <text x="190" y="322">Lane 0</text><text x="310" y="322">Lane 1</text><text x="430" y="322">Lane 2</text><text x="550" y="322">Lane 3</text>
  </g>

  <g font-size="14" fill="#111">
    <text x="650" y="150" font-weight="bold">Cómo se lee</text>
    <line x1="650" y1="168" x2="680" y2="168" stroke="#1f5fbf" stroke-width="4"/><text x="690" y="173">Par que transmite A → B</text>
    <line x1="650" y1="193" x2="680" y2="193" stroke="#c0392b" stroke-width="4"/><text x="690" y="198">Par que transmite B → A</text>
    <text x="650" y="235" font-weight="bold">Lane</text>
    <text x="650" y="255">1 par de ida + 1 par de vuelta</text>
    <text x="650" y="273">= 4 hilos (full‑duplex).</text>
    <text x="650" y="305" font-weight="bold">Enlace (link)</text>
    <text x="650" y="325">De 1 a 16 lanes: x1, x2, x4,</text>
    <text x="650" y="343">x8 o x16.</text>
  </g>
  <text x="450" y="445" text-anchor="middle" font-size="11" fill="#666">Esquema propio basado en la terminología de PCI Express.</text>
</svg>
