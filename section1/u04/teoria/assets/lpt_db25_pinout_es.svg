<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" font-family="Helvetica, Arial, sans-serif">
  <rect width="960" height="470" fill="#ffffff"/>
  <text x="480" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#111">Conector DB‑25 del puerto paralelo (LPT), numeración del macho visto de frente</text>

  <!-- carcasa D -->
  <path d="M40 90 H570 Q590 90 585 110 L555 215 Q550 235 530 235 H80 Q60 235 55 215 L25 110 Q20 90 40 90 Z" fill="#dbe7ff" stroke="#1f3b73" stroke-width="4"/>

  <!-- fila superior 1..13 -->
  <g font-size="12" font-weight="bold" fill="#fff" text-anchor="middle">
    <circle cx="65" cy="125" r="15" fill="#c0392b"/><text x="65" y="130">1</text>
    <circle cx="105" cy="125" r="15" fill="#1f5fbf"/><text x="105" y="130">2</text>
    <circle cx="145" cy="125" r="15" fill="#1f5fbf"/><text x="145" y="130">3</text>
    <circle cx="185" cy="125" r="15" fill="#1f5fbf"/><text x="185" y="130">4</text>
    <circle cx="225" cy="125" r="15" fill="#1f5fbf"/><text x="225" y="130">5</text>
    <circle cx="265" cy="125" r="15" fill="#1f5fbf"/><text x="265" y="130">6</text>
    <circle cx="305" cy="125" r="15" fill="#1f5fbf"/><text x="305" y="130">7</text>
    <circle cx="345" cy="125" r="15" fill="#1f5fbf"/><text x="345" y="130">8</text>
    <circle cx="385" cy="125" r="15" fill="#1f5fbf"/><text x="385" y="130">9</text>
    <circle cx="425" cy="125" r="15" fill="#1b7f3b"/><text x="425" y="130">10</text>
    <circle cx="465" cy="125" r="15" fill="#1b7f3b"/><text x="465" y="130">11</text>
    <circle cx="505" cy="125" r="15" fill="#1b7f3b"/><text x="505" y="130">12</text>
    <circle cx="545" cy="125" r="15" fill="#1b7f3b"/><text x="545" y="130">13</text>
    <!-- fila inferior 14..25 -->
    <circle cx="85" cy="195" r="15" fill="#d97706"/><text x="85" y="200">14</text>
    <circle cx="125" cy="195" r="15" fill="#1b7f3b"/><text x="125" y="200">15</text>
    <circle cx="165" cy="195" r="15" fill="#d97706"/><text x="165" y="200">16</text>
    <circle cx="205" cy="195" r="15" fill="#d97706"/><text x="205" y="200">17</text>
    <circle cx="245" cy="195" r="15" fill="#333"/><text x="245" y="200">18</text>
    <circle cx="285" cy="195" r="15" fill="#333"/><text x="285" y="200">19</text>
    <circle cx="325" cy="195" r="15" fill="#333"/><text x="325" y="200">20</text>
    <circle cx="365" cy="195" r="15" fill="#333"/><text x="365" y="200">21</text>
    <circle cx="405" cy="195" r="15" fill="#333"/><text x="405" y="200">22</text>
    <circle cx="445" cy="195" r="15" fill="#333"/><text x="445" y="200">23</text>
    <circle cx="485" cy="195" r="15" fill="#333"/><text x="485" y="200">24</text>
    <circle cx="525" cy="195" r="15" fill="#333"/><text x="525" y="200">25</text>
  </g>

  <!-- tabla de señales -->
  <g font-size="13" fill="#111">
    <text x="40" y="280" font-weight="bold">Pines 1 a 13</text>
    <text x="40" y="302"><tspan font-weight="bold" fill="#c0392b">1</tspan> STROBE · pulso de «dato válido»</text>
    <text x="40" y="322"><tspan font-weight="bold" fill="#1f5fbf">2–9</tspan> D0–D7 · ocho bits de datos</text>
    <text x="40" y="342"><tspan font-weight="bold" fill="#1b7f3b">10</tspan> ACK · dato recibido</text>
    <text x="40" y="362"><tspan font-weight="bold" fill="#1b7f3b">11</tspan> BUSY · impresora ocupada</text>
    <text x="40" y="382"><tspan font-weight="bold" fill="#1b7f3b">12</tspan> PE · sin papel</text>
    <text x="40" y="402"><tspan font-weight="bold" fill="#1b7f3b">13</tspan> SEL · impresora seleccionada</text>

    <text x="420" y="280" font-weight="bold">Pines 14 a 25</text>
    <text x="420" y="302"><tspan font-weight="bold" fill="#d97706">14</tspan> AUTOFEED · salto de línea automático</text>
    <text x="420" y="322"><tspan font-weight="bold" fill="#1b7f3b">15</tspan> ERROR · fallo de la impresora</text>
    <text x="420" y="342"><tspan font-weight="bold" fill="#d97706">16</tspan> INIT · reinicio de la impresora</text>
    <text x="420" y="362"><tspan font-weight="bold" fill="#d97706">17</tspan> SELECT IN · selección desde el PC</text>
    <text x="420" y="382"><tspan font-weight="bold" fill="#333">18–25</tspan> GND · masas</text>
  </g>
  <text x="40" y="436" font-size="12" fill="#333">En el hembra del PC la numeración se ve en espejo. Rojo y naranja: salidas del PC · azul: datos · verde: entradas del PC.</text>
  <text x="480" y="458" text-anchor="middle" font-size="11" fill="#666">Esquema propio basado en la norma IEEE 1284 (puerto paralelo).</text>
</svg>
