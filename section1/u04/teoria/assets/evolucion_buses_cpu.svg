<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" font-family="Helvetica, Arial, sans-serif">
  <rect width="1000" height="520" fill="#ffffff"/>
  <text x="250" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#111">Antes (hasta 2008‑2009): FSB</text>
  <text x="750" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#111">Ahora: enlaces punto a punto</text>
  <line x1="500" y1="50" x2="500" y2="490" stroke="#d1d5db" stroke-dasharray="6 6"/>

  <!-- IZQUIERDA -->
  <g font-size="15" font-weight="bold" fill="#fff" text-anchor="middle">
    <rect x="150" y="60" width="200" height="55" rx="10" fill="#1f3b73"/><text x="250" y="94">CPU</text>
    <rect x="130" y="190" width="240" height="70" rx="10" fill="#b45309"/><text x="250" y="222">Northbridge</text><text x="250" y="243" font-size="12" font-weight="normal">controlador de memoria</text>
    <rect x="130" y="340" width="240" height="60" rx="10" fill="#7c3aed"/><text x="250" y="376">Southbridge</text>
    <rect x="20" y="195" width="85" height="60" rx="10" fill="#1b7f3b"/><text x="62" y="222">RAM</text><text x="62" y="240" font-size="11" font-weight="normal">memoria</text>
    <rect x="395" y="195" width="95" height="60" rx="10" fill="#4b5563"/><text x="442" y="222">GPU</text><text x="442" y="240" font-size="11" font-weight="normal">AGP / PCIe</text>
  </g>
  <line x1="250" y1="115" x2="250" y2="190" stroke="#c0392b" stroke-width="9"/>
  <text x="262" y="158" font-size="13" font-weight="bold" fill="#c0392b">FSB (bus compartido,</text>
  <text x="262" y="174" font-size="13" font-weight="bold" fill="#c0392b">64 bits, paralelo)</text>
  <line x1="105" y1="225" x2="130" y2="225" stroke="#1b7f3b" stroke-width="7"/>
  <line x1="370" y1="225" x2="395" y2="225" stroke="#4b5563" stroke-width="7"/>
  <line x1="250" y1="260" x2="250" y2="340" stroke="#7c3aed" stroke-width="7"/>
  <text x="262" y="305" font-size="12" fill="#333">enlace interno</text>
  <g font-size="12" fill="#333" text-anchor="middle">
    <text x="250" y="425">PCI, USB, SATA, audio, red, BIOS…</text>
    <text x="250" y="470" fill="#b00020" font-weight="bold">Todo el tráfico pasa por el Northbridge.</text>
  </g>

  <!-- DERECHA -->
  <g font-size="15" font-weight="bold" fill="#fff" text-anchor="middle">
    <rect x="530" y="60" width="90" height="60" rx="10" fill="#1b7f3b"/><text x="575" y="88">RAM</text><text x="575" y="106" font-size="11" font-weight="normal">memoria</text>
    <rect x="650" y="60" width="210" height="95" rx="10" fill="#1f3b73"/><text x="755" y="92">CPU</text>
    <text x="755" y="112" font-size="12" font-weight="normal">controlador de memoria</text><text x="755" y="130" font-size="12" font-weight="normal">+ líneas PCIe</text>
    <rect x="895" y="60" width="95" height="40" rx="10" fill="#7c3aed"/><text x="942" y="86">GPU</text>
    <rect x="895" y="115" width="95" height="40" rx="10" fill="#7c3aed"/><text x="942" y="141" font-size="13">SSD NVMe</text>
    <rect x="635" y="340" width="240" height="60" rx="10" fill="#b45309"/><text x="755" y="376">Chipset (PCH)</text>
  </g>
  <line x1="620" y1="90" x2="650" y2="90" stroke="#1b7f3b" stroke-width="7"/>
  <text x="575" y="140" text-anchor="middle" font-size="12" font-weight="bold" fill="#1b7f3b">Bus de</text>
  <text x="575" y="156" text-anchor="middle" font-size="12" font-weight="bold" fill="#1b7f3b">memoria</text>
  <line x1="860" y1="80" x2="895" y2="80" stroke="#7c3aed" stroke-width="7"/>
  <line x1="860" y1="135" x2="895" y2="135" stroke="#7c3aed" stroke-width="7"/>
  <text x="942" y="180" text-anchor="middle" font-size="12" font-weight="bold" fill="#7c3aed">PCIe</text>
  <line x1="755" y1="155" x2="755" y2="340" stroke="#c0392b" stroke-width="9"/>
  <text x="770" y="235" font-size="13" font-weight="bold" fill="#c0392b">DMI (Intel) o PCIe x4 (AMD)</text>
  <text x="770" y="253" font-size="12" fill="#333">enlace serie punto a punto</text>
  <g font-size="12" fill="#333" text-anchor="middle">
    <text x="755" y="425">USB, SATA, PCIe, audio, red, SPI…</text>
    <text x="755" y="470" fill="#1b7f3b" font-weight="bold">La memoria y la GPU no pasan por el chipset.</text>
  </g>
  <text x="500" y="505" text-anchor="middle" font-size="11" fill="#666">Esquema propio.</text>
</svg>
