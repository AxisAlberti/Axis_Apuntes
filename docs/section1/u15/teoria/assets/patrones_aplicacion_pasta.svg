<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" font-family="Helvetica, Arial, sans-serif">
  <rect width="960" height="360" fill="#ffffff"/>
  <text x="480" y="34" text-anchor="middle" font-size="21" font-weight="bold" fill="#111">Patrones habituales de aplicación de pasta térmica</text>
  <text x="480" y="58" text-anchor="middle" font-size="13" fill="#444">Cada cuadrado representa la superficie del procesador (IHS). La pasta se aplica en el centro.</text>

  <!-- 1. punto -->
  <g transform="translate(60,90)">
    <rect x="0" y="0" width="180" height="180" rx="6" fill="#eef2f7" stroke="#334155" stroke-width="2"/>
    <circle cx="90" cy="90" r="16" fill="#e5e7eb" stroke="#374151" stroke-width="2"/>
  </g>
  <text x="150" y="300" text-anchor="middle" font-size="15" font-weight="bold" fill="#111">Punto central</text>
  <text x="150" y="320" text-anchor="middle" font-size="12.5" fill="#333">Habitual en procesadores pequeños</text>

  <!-- 2. linea -->
  <g transform="translate(300,90)">
    <rect x="0" y="0" width="180" height="180" rx="6" fill="#eef2f7" stroke="#334155" stroke-width="2"/>
    <rect x="30" y="84" width="120" height="12" rx="6" fill="#e5e7eb" stroke="#374151" stroke-width="2"/>
  </g>
  <text x="390" y="300" text-anchor="middle" font-size="15" font-weight="bold" fill="#111">Línea</text>
  <text x="390" y="320" text-anchor="middle" font-size="12.5" fill="#333">Procesadores alargados</text>

  <!-- 3. X -->
  <g transform="translate(540,90)">
    <rect x="0" y="0" width="180" height="180" rx="6" fill="#eef2f7" stroke="#334155" stroke-width="2"/>
    <line x1="40" y1="40" x2="140" y2="140" stroke="#374151" stroke-width="10" stroke-linecap="round" opacity="0.5"/>
    <line x1="140" y1="40" x2="40" y2="140" stroke="#374151" stroke-width="10" stroke-linecap="round" opacity="0.5"/>
  </g>
  <text x="630" y="300" text-anchor="middle" font-size="15" font-weight="bold" fill="#111">En X</text>
  <text x="630" y="320" text-anchor="middle" font-size="12.5" fill="#333">Reparte la pasta por las cuatro esquinas</text>

  <!-- 4. extension -->
  <g transform="translate(780,90)">
    <rect x="0" y="0" width="150" height="180" rx="6" fill="#eef2f7" stroke="#334155" stroke-width="2"/>
    <rect x="20" y="70" width="110" height="40" rx="4" fill="#e5e7eb" stroke="#374151" stroke-width="2"/>
  </g>
  <text x="855" y="300" text-anchor="middle" font-size="15" font-weight="bold" fill="#111">Extensión</text>
  <text x="855" y="320" text-anchor="middle" font-size="12.5" fill="#333">Con espátula o tarjeta</text>

  <text x="480" y="350" text-anchor="middle" font-size="11" fill="#666">Esquema propio. La cantidad debe ser pequeña y la técnica depende del procesador y del disipador: consultar la guía del fabricante.</text>
</svg>
