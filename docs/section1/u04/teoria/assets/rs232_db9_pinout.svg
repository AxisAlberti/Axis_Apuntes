<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 440" font-family="Helvetica, Arial, sans-serif">
  <rect width="860" height="440" fill="#ffffff"/>
  <text x="430" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#111">Conector DB‑9 macho del PC (DTE), visto de frente</text>

  <!-- carcasa en forma de D -->
  <path d="M120 150 H420 Q440 150 435 170 L405 270 Q400 290 380 290 H160 Q140 290 135 270 L105 170 Q100 150 120 150 Z" fill="#dbe7ff" stroke="#1f3b73" stroke-width="4"/>

  <!-- fila superior: pines 1 a 5 -->
  <g font-size="15" font-weight="bold" fill="#fff" text-anchor="middle">
    <circle cx="150" cy="190" r="20" fill="#1f3b73"/><text x="150" y="196">1</text>
    <circle cx="210" cy="190" r="20" fill="#1f3b73"/><text x="210" y="196">2</text>
    <circle cx="270" cy="190" r="20" fill="#1f3b73"/><text x="270" y="196">3</text>
    <circle cx="330" cy="190" r="20" fill="#1f3b73"/><text x="330" y="196">4</text>
    <circle cx="390" cy="190" r="20" fill="#1f3b73"/><text x="390" y="196">5</text>
    <!-- fila inferior: pines 6 a 9 -->
    <circle cx="180" cy="250" r="20" fill="#1f3b73"/><text x="180" y="256">6</text>
    <circle cx="240" cy="250" r="20" fill="#1f3b73"/><text x="240" y="256">7</text>
    <circle cx="300" cy="250" r="20" fill="#1f3b73"/><text x="300" y="256">8</text>
    <circle cx="360" cy="250" r="20" fill="#1f3b73"/><text x="360" y="256">9</text>
  </g>

  <!-- etiquetas -->
  <g font-size="13" fill="#111" text-anchor="middle">
    <g font-weight="bold">
      <text x="150" y="135" fill="#0f766e">DCD</text><text x="210" y="135" fill="#1f5fbf">RXD</text><text x="270" y="135" fill="#c0392b">TXD</text><text x="330" y="135" fill="#7c3aed">DTR</text><text x="390" y="135" fill="#333">GND</text>
      <text x="180" y="318" fill="#0f766e">DSR</text><text x="240" y="318" fill="#d97706">RTS</text><text x="300" y="318" fill="#d97706">CTS</text><text x="360" y="318" fill="#be185d">RI</text>
    </g>
  </g>

  <!-- leyenda -->
  <g font-size="14" fill="#111">
    <text x="500" y="110" font-weight="bold">Significado de las señales</text>
    <text x="500" y="140"><tspan font-weight="bold">1 DCD</tspan> · Detección de portadora</text>
    <text x="500" y="165"><tspan font-weight="bold">2 RXD</tspan> · Recepción de datos</text>
    <text x="500" y="190"><tspan font-weight="bold">3 TXD</tspan> · Transmisión de datos</text>
    <text x="500" y="215"><tspan font-weight="bold">4 DTR</tspan> · Terminal de datos listo</text>
    <text x="500" y="240"><tspan font-weight="bold">5 GND</tspan> · Masa de señal</text>
    <text x="500" y="265"><tspan font-weight="bold">6 DSR</tspan> · Equipo de datos listo</text>
    <text x="500" y="290"><tspan font-weight="bold">7 RTS</tspan> · Petición de envío</text>
    <text x="500" y="315"><tspan font-weight="bold">8 CTS</tspan> · Listo para enviar</text>
    <text x="500" y="340"><tspan font-weight="bold">9 RI</tspan> · Indicador de llamada</text>
  </g>
  <text x="30" y="385" font-size="13" fill="#333">En el conector hembra (lado del dispositivo) la numeración se ve en espejo.</text>
  <text x="430" y="425" text-anchor="middle" font-size="11" fill="#666">Esquema propio basado en el estándar RS‑232 (TIA‑574).</text>
</svg>
